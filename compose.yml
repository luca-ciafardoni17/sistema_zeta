services:
  # ------------ Database ------------ #
  storage-db:
    image: postgres:latest
    container_name: zeta_storage
    environment:
      POSTGRES_DB: zeta_storage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - storage_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zeta_storage"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeta-net
  auth-db:
    image: mysql:latest
    container_name: zeta_auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zeta_auth
    ports:
      - "3307:3306"
    volumes:
      - auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeta-net

  # ------------ Kafka ------------ #
  # kafka:
  #  image: confluentinc/cp-kafka:latest
  #  ports:
  #    - "9092:9092"
  #  environment:
  #    KAFKA_NODE_ID: ...
  #  networks:
  #    - zeta-net

  # ------------ Microservizi ------------ #
  storage:
    build: ./storage
    ports:
      - "8082:8082"
    environment:
      - DATABASE_HOST=storage-db
      - DATABASE_PORT=5432
      - LOGSTASH_HOST=logstash
    depends_on:
      storage-db:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - zeta-net
  auth:
    build: auth
    ports:
      - "8081:8081"
    environment:
      - DATABASE_HOST=auth-db
      - DATABASE_PORT=3306
      - LOGSTASH_HOST=logstash
    depends_on:
      auth-db:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - zeta-net

  # ------------ ELK ------------ #
  elasticsearch:
    image: elasticsearch:8.17.1
    container_name: elasticsearch
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data/
    environment:
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xmx256m -Xms256m
      - discovery.type=single-node
    ports:
      - '9200:9200'
    networks:
      - zeta-net

  logstash:
    image: logstash:8.17.1
    container_name: logstash
    volumes:
      - ./logstash/:/logstash_dir
    command: logstash -f /logstash_dir/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    ports:
      - '5044:5044'
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
    networks:
      - zeta-net

  kibana:
    image: kibana:8.17.1
    container_name: kibana
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - zeta-net

volumes:
  storage_data:
  auth_data:
  elasticsearch_data:

networks:
  zeta-net:
    driver: bridge